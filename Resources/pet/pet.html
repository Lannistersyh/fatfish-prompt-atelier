<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 240px; height: 310px;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  #sprite {
    position: absolute;
    left: 36px;
    bottom: 8px;
    width: 168px;
    height: 182px;
    object-fit: contain;
    filter: drop-shadow(0 8px 10px rgba(28, 46, 110, .28));
    transform-origin: 50% 92%;
    animation: breathe 3.6s ease-in-out infinite;
  }
  body.working #sprite { animation-duration: 1.4s; }
  body.success #sprite { animation: hop .5s ease-out 2; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-2px) scale(1.012); }
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
  }

  #ground {
    position: absolute;
    left: 50%;
    bottom: 4px;
    width: 132px; height: 16px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(30, 50, 120, .30), rgba(30, 50, 120, 0));
    filter: blur(1px);
  }
  #bubble {
    position: absolute;
    left: 50%;
    bottom: 196px;
    transform: translate(-50%, 6px);
    max-width: 214px;
    padding: 7px 11px;
    font-size: 11.5px;
    line-height: 1.45;
    color: #2c3663;
    text-align: center;
    background: rgba(255, 255, 255, .95);
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 13px;
    box-shadow: 0 6px 18px rgba(28, 46, 110, .22);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
  }
  #bubble::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: -5px;
    width: 9px; height: 9px;
    margin-left: -4.5px;
    background: rgba(255, 255, 255, .95);
    border-right: 1px solid rgba(255, 255, 255, .9);
    border-bottom: 1px solid rgba(255, 255, 255, .9);
    transform: rotate(45deg);
  }
  #bubble.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <div id="ground"></div>
  <div id="bubble"></div>
  <img id="sprite" src="fatfish-idle-0.webp" alt="大肥鱼">
<script>
  const STATES = {
    idle:    { prefix: 'fatfish-idle-',    n: 6, fps: 7,  loop: true  },
    hover:   { prefix: 'fatfish-hover-',   n: 5, fps: 10, loop: false, next: 'idle' },
    working: { prefix: 'fatfish-working-', n: 6, fps: 9,  loop: true  },
    success: { prefix: 'fatfish-success-', n: 6, fps: 9,  loop: false, next: 'idle' }
  };

  const sprite = document.getElementById('sprite');
  const bubbleEl = document.getElementById('bubble');

  // 预加载全部帧
  for (const key of Object.keys(STATES)) {
    const s = STATES[key];
    for (let i = 0; i < s.n; i += 1) {
      const img = new Image();
      img.src = `${s.prefix}${i}.webp`;
    }
  }

  let current = 'idle';
  let frame = 0;
  let timer = null;
  let bubbleTimer = null;

  function render() {
    const s = STATES[current];
    sprite.src = `${s.prefix}${frame}.webp`;
  }

  function play(name) {
    if (!STATES[name]) return;
    if (timer) clearInterval(timer);
    current = name;
    frame = 0;
    document.body.className = name === 'idle' ? '' : name;
    render();
    const s = STATES[name];
    timer = setInterval(() => {
      frame += 1;
      if (frame >= s.n) {
        if (s.loop) {
          frame = 0;
        } else {
          clearInterval(timer);
          timer = null;
          play(s.next || 'idle');
          return;
        }
      }
      render();
    }, 1000 / s.fps);
  }

  function bubble(payload) {
    const text = (payload && payload.text) || '';
    const seconds = (payload && payload.seconds) || 3;
    if (!text) { bubbleEl.classList.remove('show'); return; }
    bubbleEl.textContent = text;
    bubbleEl.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubbleEl.classList.remove('show'), seconds * 1000);
  }

  window.__pet = {
    get state() { return current; },
    setState(name) { play(name); },
    hover(inside) {
      if (inside && current === 'idle') {
        play('hover');
        bubble({ text: '戳我写提示词 ✨', seconds: 2.4 });
      } else if (!inside && current === 'hover') {
        play('idle');
      }
    },
    bubble
  };

  play('idle');
</script>
</body>
</html>
